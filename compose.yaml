services:
  app:
    build: .
    env_file: .env
    environment:
      FORTE_HOST: 0.0.0.0
      FORTE_OLLAMA_URL: http://ollama:11434
      FORTE_DEVICE: cpu
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./config:/app/config:ro
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
volumes:
  ollama_models:
