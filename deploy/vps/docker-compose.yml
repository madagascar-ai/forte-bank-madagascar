# Public entry for the jury: HTTPS on the domain, forwarded over Tailscale to the GPU machine.
# The VPS only proxies requests; videos are processed and stored on the team machine.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: forte-proxy
    # Run tailscaled directly: the image's default entrypoint gives an interactive login only 60 s
    # and then restarts with a new key. State persists in ./ts-state, so one login is enough:
    #   docker compose exec tailscale tailscale up --hostname=forte-proxy
    entrypoint: ["tailscaled", "--state=/var/lib/tailscale/tailscaled.state", "--statedir=/var/lib/tailscale"]
    volumes:
      - ./ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped

  caddy:
    image: caddy:2
    # Shares the Tailscale network namespace, so 100.x addresses are reachable directly.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    restart: unless-stopped
