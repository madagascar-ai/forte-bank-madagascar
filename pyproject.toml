[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forte-guard"
version = "0.1.0"
description = "Local video -> object journal -> action journal -> parallel candidate generators"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18",
  "pydantic>=2.9,<3", "httpx>=0.27,<1", "numpy>=1.26,<3",
  "opencv-python>=4.10,<5", "PyYAML>=6,<7",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "lap>=0.5", "openai-clip>=1.0.1", "setuptools>=75,<81"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
forte-guard = "forte_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forte_guard = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
